# ============================================================
# CampusOS - Continuous Delivery
#
# Every push to main (i.e. every merged release PR from dev) and every
# version tag (v1.2.3) produces deployable artifacts:
#
#   * the web app as a static build attached to the run (and to the
#     GitHub Release for version tags)
#
# (There is no container image: the repository has no Docker files.)
#
# CI must already be green: the workflow re-runs it first and stops on
# failure, so a broken commit can never be published.
#
# Deploying those artifacts to a host is a separate step to add once the
# hosting target is chosen (see UPDATES.md open questions).
# ============================================================

name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Verify
    uses: ./.github/workflows/ci.yml

  web-build:
    name: Build web app
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}

      - name: Package
        run: tar -czf ../campusos-web-${{ github.ref_name }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: campusos-web
          path: campusos-web-${{ github.ref_name }}.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: campusos-web-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
