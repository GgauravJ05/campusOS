<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusOS architecture (slide)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #ffffff; --color-ink: #1b2a5c; --color-muted: #5b6480;
            --font-sans: Calibri, 'Helvetica Neue', Arial, sans-serif; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: Cambria, Georgia, serif; font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 640px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CampusOS · slide 7</p>
    <h1>Layered client–server architecture</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-slide-title architecture-slide-desc" font-family="Calibri, 'Helvetica Neue', Arial, sans-serif">
        <title id="architecture-slide-title">CampusOS layered architecture</title>
        <desc id="architecture-slide-desc">A React web app and a public page call an Express API whose request pipeline checks sign-in, role and input before the services run; the services and a reminder worker use PostgreSQL 16, where database rules refuse overlapping bookings and over-capacity seats, and an optional mail server sends codes, decisions and reminders.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6480"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b3262e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- zones -->
        <rect x="16" y="20" width="404" height="96" rx="8" fill="#f1f4fa" stroke="#d5dae8" stroke-width="0.8"/>
        <rect x="24" y="22" width="52" height="12" rx="2" fill="#f1f4fa"/>
        <text x="28" y="31" fill="#5b6480" font-size="8" letter-spacing="0.14em">CLIENT</text>
        <rect x="16" y="128" width="608" height="96" rx="8" fill="#f1f4fa" stroke="#d5dae8" stroke-width="0.8"/>
        <rect x="240" y="130" width="156" height="12" rx="2" fill="#f1f4fa"/>
        <text x="244" y="139" fill="#5b6480" font-size="8" letter-spacing="0.14em">API · EXPRESS 5 · NODE.JS</text>
        <rect x="16" y="236" width="608" height="96" rx="8" fill="#f1f4fa" stroke="#d5dae8" stroke-width="0.8"/>
        <rect x="24" y="238" width="104" height="12" rx="2" fill="#f1f4fa"/>
        <text x="28" y="247" fill="#5b6480" font-size="8" letter-spacing="0.14em">DATA · POSTGRESQL</text>

        <!-- arrows (drawn before nodes) -->
        <line x1="96" y1="104" x2="96" y2="146" stroke="#5b6480" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M300,104 V114 Q300,122 292,122 H160 Q152,122 152,130 V146" fill="none" stroke="#5b6480" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="212" y1="180" x2="234" y2="180" stroke="#5b6480" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="324" y1="212" x2="324" y2="254" stroke="#b3262e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M524,212 V280 Q524,288 516,288 H414" fill="none" stroke="#5b6480" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="524" y1="148" x2="524" y2="106" stroke="#5b6480" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M412,172 H418 Q424,172 424,166 V78 Q424,72 430,72 H434" fill="none" stroke="#5b6480" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- arrow labels -->
        <rect x="40" y="111" width="48" height="14" rx="2" fill="#ffffff"/>
        <text x="64" y="122" fill="#5b6480" font-size="12" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="332" y="225" width="36" height="14" rx="2" fill="#ffffff"/>
        <text x="350" y="236" fill="#b3262e" font-size="12" text-anchor="middle" letter-spacing="0.06em">SQL</text>
        <rect x="532" y="119" width="52" height="14" rx="2" fill="#ffffff"/>
        <text x="558" y="130" fill="#5b6480" font-size="12" text-anchor="middle" letter-spacing="0.06em">EMAIL</text>

        <!-- row 1 -->
        <rect x="36" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#1b2a5c" stroke-width="1"/>
        <text x="124" y="68" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Web app</text>
        <text x="124" y="88" fill="#5b6480" font-size="12" text-anchor="middle">React 19 · 5 role views</text>
        <rect x="236" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#1b2a5c" stroke-width="1"/>
        <text x="324" y="68" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Public page</text>
        <text x="324" y="88" fill="#5b6480" font-size="12" text-anchor="middle">static HTML · XHR</text>
        <rect x="436" y="40" width="176" height="64" rx="6" fill="#ffffff"/>
        <rect x="436" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#5b6480" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="524" y="68" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Mail server</text>
        <text x="524" y="88" fill="#5b6480" font-size="12" text-anchor="middle">SMTP · optional</text>

        <!-- row 2 -->
        <rect x="36" y="148" width="176" height="64" rx="6" fill="#ffffff" stroke="#1b2a5c" stroke-width="1"/>
        <text x="124" y="176" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Request pipeline</text>
        <text x="124" y="196" fill="#5b6480" font-size="12" text-anchor="middle">JWT · RBAC · validation</text>
        <rect x="236" y="148" width="176" height="64" rx="6" fill="#ffffff" stroke="#1b2a5c" stroke-width="1"/>
        <text x="324" y="176" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Services</text>
        <text x="324" y="196" fill="#5b6480" font-size="12" text-anchor="middle">bookings · events · audit</text>
        <rect x="436" y="148" width="176" height="64" rx="6" fill="#ffffff" stroke="#1b2a5c" stroke-width="1"/>
        <text x="524" y="176" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Reminder worker</text>
        <text x="524" y="196" fill="#5b6480" font-size="12" text-anchor="middle">48 h and 2 h reminders</text>

        <!-- row 3 -->
        <rect x="36" y="256" width="176" height="64" rx="6" fill="#ffffff"/>
        <rect x="36" y="256" width="176" height="64" rx="6" fill="#fbeaea" stroke="#b3262e" stroke-width="1.4"/>
        <text x="124" y="284" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">Database rules</text>
        <text x="124" y="304" fill="#5b6480" font-size="12" text-anchor="middle">exclusion · triggers</text>
        <rect x="236" y="256" width="176" height="64" rx="6" fill="#ffffff" stroke="#1b2a5c" stroke-width="1"/>
        <text x="324" y="284" fill="#1b2a5c" font-size="16" font-weight="600" text-anchor="middle">PostgreSQL 16</text>
        <text x="324" y="304" fill="#5b6480" font-size="12" text-anchor="middle">24 tables · row locks</text>

        <!-- legend strip -->
        <rect x="16" y="340" width="12" height="10" rx="2" fill="#fbeaea" stroke="#b3262e" stroke-width="1.2"/>
        <text x="34" y="349" fill="#5b6480" font-size="10">Enforced by the database, even if the API has a bug</text>
        <line x1="300" y1="345" x2="324" y2="345" stroke="#5b6480" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="330" y="349" fill="#5b6480" font-size="10">External or optional</text>
        <line x1="452" y1="345" x2="476" y2="345" stroke="#b3262e" stroke-width="1.4"/>
        <text x="482" y="349" fill="#5b6480" font-size="10">Locked transaction path</text>
      </svg>
    </div>
  </div>
</body>
</html>
