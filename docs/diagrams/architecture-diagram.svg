<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">CampusOS system architecture</title>
      <desc id="arch-desc">Layered architecture of CampusOS: a React web app and a public page call an Express API whose request pipeline authorises every call; services and a plain-code domain layer sit on PostgreSQL, whose constraints and triggers enforce the booking and seat rules; a background worker and an optional mail server complete the picture.</desc>
